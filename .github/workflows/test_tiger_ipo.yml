name: Test Tiger OpenAPI IPO & Fee Capabilities

on:
  workflow_dispatch:

jobs:
  test-tiger-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tiger IPO & Fee Capability Diagnostic
        env:
          TIGER_ID: ${{ secrets.TIGER_ID }}
          TIGER_ACCOUNT: ${{ secrets.TIGER_ACCOUNT }}
          TIGER_PRIVATE_KEY_PATH: ${{ secrets.TIGER_PRIVATE_KEY_PATH }}
        run: |
          python scripts/test_tiger_ipo_api.py
