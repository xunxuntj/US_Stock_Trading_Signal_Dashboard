name: Daily v2.29 Trading Signal Scan

on:
  workflow_dispatch: # Primary: Triggered precisely via external Cronjob / Webhook API or manual click
  schedule:
    # Fallback backup triggers (Note: GitHub internal cron may experience delay)
    - cron: '30 21 * * 1-5' # 21:30 UTC Mon-Fri (美东 16:30 盘后)
    - cron: '30 5 * * 2-6'  # 05:30 UTC Tue-Sat (美东 01:30 盘前对账)

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Live Market Data & Run Scan
        run: |
          python download_data.py
          python run_daily_scan.py

      - name: Commit & Push Updated Database / Signals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add portfolio.db data/
          git diff-index --quiet HEAD || git commit -m "auto: Daily v2.29 signal scan & database sync"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }}
