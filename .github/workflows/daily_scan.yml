name: Daily v2.29 Trading Signal Scan

on:
  schedule:
    # 1. 首选主调度: 美股收盘后 30 分钟 (21:30 UTC Mon-Fri / 美东 16:30)
    - cron: '30 21 * * 1-5'
    # 2. Fallback 1 (+2小时重试): 23:30 UTC Mon-Fri (美东 19:30)
    - cron: '30 23 * * 1-5'
    # 3. Fallback 2 (+4小时重试): 01:30 UTC Tue-Sat (美东 21:30)
    - cron: '30 1 * * 2-6'
    # 4. Fallback 3 (+8小时终极对账): 05:30 UTC Tue-Sat (美东 01:30 / 次晨开盘前对账)
    - cron: '30 5 * * 2-6'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Live Market Data & Run Scan
        run: |
          python download_data.py
          python run_daily_scan.py

      - name: Commit & Push Updated Database / Signals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add portfolio.db data/
          git diff-index --quiet HEAD || git commit -m "auto: Daily v2.29 signal scan & database sync"
          git push
