name: Daily v2.29 Trading Signal Scan

on:
  schedule:
    # Runs at 21:30 UTC Mon-Fri (4:30 PM EST after US market close)
    - cron: '30 21 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Live Market Data & Run Scan
        run: |
          python download_data.py
          python run_daily_scan.py

      - name: Commit & Push Updated Database / Signals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add portfolio.db data/
          git diff-index --quiet HEAD || git commit -m "auto: Daily v2.29 signal scan & database sync"
          git push
