name: Daily v3.0 Quantitative Signal & Proactive Push Scan

concurrency:
  group: v3-daily-scan-pipeline
  cancel-in-progress: false

on:
  workflow_dispatch: # 手动一键触发或外部 Cron Webhook 调用
  schedule:
    # 21:30 UTC Mon-Fri (美东 16:30 盘后扫描并主动推送)
    - cron: '30 21 * * 1-5'
    # 05:30 UTC Tue-Sat (美东 01:30 盘前二次对账)
    - cron: '30 5 * * 2-6'

jobs:
  scan-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run v3 Automated Tests (Sanity Verification)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python tests/test_v3_suite.py

      - name: Download Live Market Data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python download_data.py

      - name: Execute v3.0 Pipeline (Technical Guard + Multi-Broker + Proactive Push)
        env:
          SHADOW_MODE: ${{ secrets.SHADOW_MODE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_PROXY_URL: ${{ secrets.TELEGRAM_PROXY_URL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TIGER_ID: ${{ secrets.TIGER_ID }}
          TIGER_ACCOUNT: ${{ secrets.TIGER_ACCOUNT }}
          TIGER_PRIVATE_KEY_PATH: ${{ secrets.TIGER_PRIVATE_KEY_PATH }}
          SCHWAB_APP_KEY: ${{ secrets.SCHWAB_APP_KEY }}
          SCHWAB_APP_SECRET: ${{ secrets.SCHWAB_APP_SECRET }}
          SCHWAB_REFRESH_TOKEN: ${{ secrets.SCHWAB_REFRESH_TOKEN }}
          SCHWAB_ACCOUNT_NUMBER: ${{ secrets.SCHWAB_ACCOUNT_NUMBER }}
        run: |
          python run_v3_scan.py

      - name: Commit & Push Updated Database / Signals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add portfolio.db data/
          git diff-index --quiet HEAD || git commit -m "auto: Daily v3.0 signal scan & database sync"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }}
