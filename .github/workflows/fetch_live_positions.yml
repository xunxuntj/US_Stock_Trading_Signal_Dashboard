name: Fetch Live Exchange Data Directly from Brokers

on:
  workflow_dispatch:

jobs:
  fetch-live-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt python-dotenv

      - name: Fetch Live Positions & Run Historical Audit
        env:
          TIGER_ID: ${{ secrets.TIGER_ID }}
          TIGER_ACCOUNT: ${{ secrets.TIGER_ACCOUNT }}
          TIGER_PRIVATE_KEY_PATH: ${{ secrets.TIGER_PRIVATE_KEY_PATH }}
          SCHWAB_APP_KEY: ${{ secrets.SCHWAB_APP_KEY }}
          SCHWAB_APP_SECRET: ${{ secrets.SCHWAB_APP_SECRET }}
          SCHWAB_REFRESH_TOKEN: ${{ secrets.SCHWAB_REFRESH_TOKEN }}
          SCHWAB_ACCOUNT_NUMBER: ${{ secrets.SCHWAB_ACCOUNT_NUMBER }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scripts/fetch_live_exchange_data.py
          python scripts/pull_all_historical_broker_data.py

      - name: Commit Audit Comparison Artifact
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/broker_audit_comparison.json data/missing_broker_orders.csv || true
          git commit -m "auto: update broker audit comparison data" || echo "No changes to commit"
          git push origin main || echo "Push failed or nothing to push"
